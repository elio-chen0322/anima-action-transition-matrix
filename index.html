<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anima 网页导航</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #252832;
      --muted: #747b89;
      --line: #e9eaf0;
      --paper: #ffffff;
      --bg: #f7f8fb;
      --accent: #8caed8;
      --accent-soft: #eaf3fc;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 48px 24px;
      color: var(--ink);
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    .shell {
      width: min(920px, 100%);
      margin: 0 auto;
    }

    .hero { padding: 12px 4px 34px; }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 5vw, 48px);
      line-height: 1.12;
      letter-spacing: -.04em;
    }

    .subtitle {
      max-width: 560px;
      margin: 16px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.75;
    }

    .divider {
      height: 1px;
      margin: 0 0 28px;
      background: var(--line);
    }

    .section-title {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .08em;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }

    .card {
      display: block;
      padding: 24px;
      color: inherit;
      text-decoration: none;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: 0 8px 28px rgba(50, 57, 75, .05);
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }

    .card:hover,
    .card:focus-visible {
      border-color: #c5d9ef;
      box-shadow: 0 14px 34px rgba(50, 57, 75, .10);
      transform: translateY(-2px);
      outline: none;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 0 10px;
      color: #4f78a7;
      background: var(--accent-soft);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }

    .card h2 {
      margin: 20px 0 8px;
      font-size: 20px;
      letter-spacing: -.02em;
    }

    .card p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
    }

    .open {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 22px;
      color: #4f78a7;
      font-size: 13px;
      font-weight: 700;
    }

    .open span { font-size: 18px; line-height: 0; }

    footer {
      margin-top: 48px;
      color: #9aa0ac;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="hero">
      <p class="eyebrow">Anima · Web Hub</p>
      <h1>网页导航</h1>
      <p class="subtitle">从这里进入已发布的 Anima 交互页面。之后新增网页时，只需要上传文件，并在这里添加一个对应入口即可。</p>
    </header>

    <div class="divider"></div>

    <section aria-labelledby="pages-title">
      <h2 class="section-title" id="pages-title">已发布页面</h2>
      <div class="grid">
        <a class="card" href="./action-transition-matrix.html">
          <span class="badge">HTML 页面</span>
          <h2>动作承接矩阵</h2>
          <p>查看站姿、坐姿、趴姿、躺姿之间的动作承接关系和过渡方式。</p>
          <span class="open">打开页面 <span aria-hidden="true">→</span></span>
        </a>
      </div>
    </section>

    <footer>新增网页后，可使用对应文件名直接访问，例如 /demo.html。</footer>
  </main>
</body>
</html>
